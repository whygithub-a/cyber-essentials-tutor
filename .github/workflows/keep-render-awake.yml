name: Keep Render Backend Awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "::error::RENDER_HEALTH_URL secret is empty or not set"
            exit 1
          fi

          echo "Pinging Render backend at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          http_code=$(curl -L -sS -o /tmp/render_ping_body.txt \
            -w "%{http_code}" \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            "$RENDER_HEALTH_URL")

          echo "HTTP status: $http_code"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Render health endpoint did not return 2xx"
            cat /tmp/render_ping_body.txt || true
            exit 1
          fi

          echo "Render backend responded successfully."
