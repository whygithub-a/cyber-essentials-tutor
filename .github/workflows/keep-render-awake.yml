name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging Render backend..."
          curl --fail --silent --show-error --max-time 30 "${{ secrets.RENDER_HEALTH_URL }}"
          echo "Render backend responded successfully."